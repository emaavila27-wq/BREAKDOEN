<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Estado de tu compra — BREAKDOWN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav"><a href="/" class="nav-logo">BREAKDOWN</a></header>
<main class="result">
  <div>
    <p class="kicker" id="kicker"></p>
    <h1 class="title" id="title"></h1>
    <p id="text"></p>
    <a href="/" class="btn" id="cta">Volver al inicio</a>
  </div>
</main>
<script>
  // Mercado Pago vuelve con ?status=approved|pending|rejected (o collection_status).
  const q = new URLSearchParams(location.search);
  const status = q.get('status') || q.get('collection_status');
  const states = {
    approved: ['// Pago aprobado', 'Tu plan está <span>en camino</span>', 'En unos minutos te llega al mail con todo lo que necesitás. Si no lo ves, revisá spam o promociones.'],
    pending: ['// Pago pendiente', 'Esperando <span>el pago</span>', 'Cuando Mercado Pago acredite el pago te enviamos el plan al mail automáticamente.'],
    fail: ['// Pago no realizado', 'No se pudo <span>cobrar</span>', 'No se hizo ningún cargo. Podés intentar de nuevo con otro medio de pago.'],
  };
  const [k, t, x] = states[status === 'approved' ? 'approved' : status === 'pending' || status === 'in_process' ? 'pending' : 'fail'];
  document.getElementById('kicker').textContent = k;
  document.getElementById('title').innerHTML = t;
  document.getElementById('text').textContent = x;
  if (!['approved', 'pending', 'in_process'].includes(status)) {
    const cta = document.getElementById('cta');
    cta.href = '/#planes';
    cta.textContent = 'Intentar de nuevo';
  }
</script>
</body>
</html>
